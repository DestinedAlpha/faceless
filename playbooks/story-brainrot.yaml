niche: story-brainrot
# Fast-cut narrated story. Maximum pace, constant pattern interrupts, cliffhangers.
structure: [hook, inciting, twist_1, escalation, twist_2, payoff, loop]
pacing:
  seconds_per_scene: 2.8
  scene_count: [6, 12]
  total_seconds: [25, 45]
voice:
  style: "fast, animated, hyped storyteller; conversational and punchy"
  wpm: 185
  edge_voice: "en-US-AriaNeural"
  edge_rate: "+14%"
  emphasis: "keep it relentless; micro-pauses before each twist for suspense"
visual:
  art_direction: "vivid, dynamic, exaggerated cinematic; constant fresh imagery per beat"
  style_suffix: "vivid dynamic cinematic, bold, high energy, high detail"
motion:
  parallax_intensity: 0.5
  transitions: ["slide", "fade"]
captions:
  style: "brainrot"
  position: "center"
  max_words_per_group: 3
music:
  mood: ["hype", "trap", "energetic", "suspense"]
  bpm: [120, 150]
sfx: ["whoosh", "impact", "pop", "ding"]
thumbnail:
  style: "shocked-reaction framing, bright, punchy 3-word text"
title:
  patterns:
    - "You won't believe what happened next"
    - "This {topic} story is insane"
    - "Wait for the twist... {topic}"
hook_formulas:
  - "Start at the craziest moment, freeze, and say 'how did we get here?'"
  - "Promise an unbelievable twist in the first line and rush into the story."
